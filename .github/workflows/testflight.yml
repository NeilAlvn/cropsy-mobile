name: Build Archive (Flutter · Xcode 26)

# Compiles Cropsy (Flutter) with Xcode 26 on a cloud Mac and hands back an
# UNSIGNED .xcarchive as a downloadable artifact. No signing key ever touches
# CI — the archive is signed and uploaded to TestFlight locally, where Luuk's
# App Store Connect .p8 stays. Apple requires the iOS 26 SDK (Xcode 26) for
# uploads. Luuk's Mac has Xcode 26 too and ships builds with an API key (see
# docs/STORE-SUBMISSION.md in the backend repo), so this is the fallback when a local
# archive is not possible.
on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 26 found on runner. Available Xcodes:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build iOS (unsigned)
        # Compiles the Dart/Flutter layer, runs pod install, and writes the
        # Generated.xcconfig the Xcode archive step needs. No signing here.
        run: flutter build ios --release --no-codesign

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Cropsy.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Zip archive
        run: |
          cd "$RUNNER_TEMP" && zip -qry Cropsy.xcarchive.zip Cropsy.xcarchive
          ls -la Cropsy.xcarchive.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Cropsy-xcarchive
          path: ${{ runner.temp }}/Cropsy.xcarchive.zip
          retention-days: 5

      # Without this every Cropsy crash arrives in Sentry with "<redacted>" on
      # every in-app frame — Farmsy ran that way for weeks and a 35-user hang
      # could not be read at all. Sentry matches dSYMs to events by UUID, so
      # uploading here makes future events readable.
      #
      # It matters more than it looks because of the line above: the archive
      # artifact is kept for 5 days. Once it expires the symbols are gone for
      # good and that build can never be symbolicated. Farmsy lost build 31's
      # that way, and rescuing build 32's took catching it with a day to spare.
      #
      # SENTRY_AUTH_TOKEN is the organization token, whose fixed org:ci scope is
      # exactly "upload debug files" — it cannot read issues or change settings.
      # Cropsy lives in the same Sentry org as Farmsy, so the same token serves
      # both. sentry-cli reads the region from the token itself.
      #
      # Runs last and never fails the build: a missing dSYM costs readable
      # stacks, a hard failure would discard a 45-minute archive.
      - name: Upload dSYMs to Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: farmsy
          SENTRY_PROJECT: cropsy-ios
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not set — Cropsy stacks stay unsymbolicated (<redacted> frames). Set it with: gh secret set SENTRY_AUTH_TOKEN --repo NeilAlvn/cropsy-mobile"
            exit 0
          fi
          DSYMS="$RUNNER_TEMP/Cropsy.xcarchive/dSYMs"
          if [ ! -d "$DSYMS" ] || [ -z "$(ls -A "$DSYMS" 2>/dev/null)" ]; then
            echo "::warning::No dSYMs found at $DSYMS — nothing to upload."
            exit 0
          fi
          npm install -g @sentry/cli@^2
          sentry-cli --version
          sentry-cli debug-files upload "$DSYMS"
          echo "dSYMs uploaded — future Cropsy events will symbolicate."
